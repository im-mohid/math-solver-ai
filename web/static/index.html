<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Math Solver AI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="/static/app.js"></script>
</head>
<body>
  <header>
    <strong>Math Solver AI</strong>
    <span id="status" class="badge">check hocche...</span>
    <button id="newChat" class="ghost" type="button">+ Notun chat</button>
  </header>

  <div id="chat">
    <div class="msg assistant" id="welcome">Hi! Math question likho, ba file upload koro. Ager kotha mone rekhe chat kore bujhiye debo.</div>
  </div>

  <footer>
    <div class="opts">
      <label>🔎 Web search
        <select id="search">
          <option value="auto">Auto (na janle khujbe)</option>
          <option value="on">Shobshomoy</option>
          <option value="off">Off</option>
        </select>
      </label>
      <label><input type="checkbox" id="think"> 🧠 Deep think (dhimey, kintu bhalo)</label>
      <label>ভাষা
        <select id="language"><option value="bn">বাংলা</option><option value="en">English</option></select>
      </label>
    </div>
    <div id="fileRow" class="muted hidden"><span id="fileName"></span> <button id="clearFile" class="link" type="button">✕</button></div>
    <div class="composer">
      <label class="attach" title="PDF / TXT / Photo">📎
        <input id="file" type="file" accept=".pdf,.txt,.md,.tex,.png,.jpg,.jpeg,.webp" hidden>
      </label>
      <textarea id="question" rows="1" maxlength="5000" placeholder="Message likho... (Enter = pathao, Shift+Enter = notun line)"></textarea>
      <button id="askBtn">Pathao</button>
    </div>
  </footer>
</body>
</html>
