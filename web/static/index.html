<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Math Solver AI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="/static/app.js"></script>
</head>
<body>
  <main>
    <h1>Math Solver AI</h1>
    <div id="status" class="badge">Model status check hocche...</div>

    <textarea id="question" rows="5" maxlength="5000"
      placeholder="Math question likho (LaTeX hole $x^2$ format e)..."></textarea>
    <button id="askBtn">Solve koro</button>

    <div id="progress" class="hidden"></div>
    <div id="answer" class="hidden"></div>
  </main>
</body>
</html>
